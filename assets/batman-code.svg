<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="285" viewBox="0 0 1000 285">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#160D2A"/>
    </linearGradient>

    <radialGradient id="signal" cx="50%" cy="38%" r="38%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.78"/>
      <stop offset="42%" stop-color="#7C3AED" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283243"/>
      <stop offset="100%" stop-color="#080C13"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path
      id="bat"
      d="
        M0,-5
        C-12,-16 -25,-18 -37,-12
        C-30,-5 -25,0 -23,8
        C-18,3 -12,2 -7,5
        L0,14
        L7,5
        C12,2 18,3 23,8
        C25,0 30,-5 37,-12
        C25,-18 12,-16 0,-5
        Z
      "
    />
  </defs>

  <rect
    width="1000"
    height="285"
    rx="18"
    fill="url(#bg)"
  />

  <rect
    x="1"
    y="1"
    width="998"
    height="283"
    rx="17"
    fill="none"
    stroke="#7C3AED"
    stroke-opacity="0.55"
  />

  <ellipse
    cx="500"
    cy="104"
    rx="230"
    ry="105"
    fill="url(#signal)"
  >
    <animate
      attributeName="opacity"
      values="0.55;1;0.55"
      dur="3.4s"
      repeatCount="indefinite"
    />
  </ellipse>

  <g
    transform="translate(500 50) scale(1.05)"
    fill="#090D14"
    stroke="#C084FC"
    stroke-width="1.5"
    filter="url(#glow)"
  >
    <use href="#bat"/>

    <animateTransform
      attributeName="transform"
      type="scale"
      additive="sum"
      values="1;1.12;1"
      dur="3.4s"
      repeatCount="indefinite"
    />
  </g>

  <text
    x="500"
    y="112"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="34"
    font-weight="800"
    fill="#FFFFFF"
    filter="url(#textGlow)"
  >
    Pedro Henrique Nogueira
  </text>

  <text
    x="500"
    y="143"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="1.2"
    fill="#D8B4FE"
  >
    SOFTWARE ENGINEERING STUDENT
  </text>

  <g fill="#A855F7" opacity="0.85">
    <use href="#bat" transform="scale(.30)"/>

    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      path="M80,55 C250,18 365,58 500,35 C675,10 805,62 930,31"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.12;0.88;1"
      dur="8s"
      repeatCount="indefinite"
    />
  </g>

  <g fill="url(#city)">
    <path
      d="
        M0 235
        V198 H42
        V174 H68
        V210 H102
        V164 H130
        V201 H166
        V149 H196
        V207 H232
        V181 H268
        V220 H303
        V162 H335
        V201 H372
        V176 H407
        V218 H444
        V157 H477
        V202 H516
        V174 H548
        V213 H586
        V164 H620
        V203 H658
        V147 H690
        V207 H731
        V178 H764
        V218 H803
        V159 H835
        V202 H874
        V171 H906
        V212 H944
        V183 H972
        V219 H1000
        V285 H0
        Z
      "
    />
  </g>

  <g fill="#7C3AED" opacity="0.8">
    <rect x="108" y="179" width="6" height="10"/>
    <rect x="119" y="179" width="6" height="10"/>

    <rect x="174" y="166" width="6" height="10"/>
    <rect x="185" y="166" width="6" height="10"/>

    <rect x="311" y="180" width="6" height="10"/>
    <rect x="322" y="180" width="6" height="10"/>

    <rect x="452" y="175" width="6" height="10"/>
    <rect x="463" y="175" width="6" height="10"/>

    <rect x="665" y="164" width="6" height="10"/>
    <rect x="676" y="164" width="6" height="10"/>

    <rect x="811" y="177" width="6" height="10"/>
    <rect x="822" y="177" width="6" height="10"/>

    <rect x="881" y="187" width="6" height="10"/>
    <rect x="892" y="187" width="6" height="10"/>
  </g>

  <text
    x="500"
    y="258"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="2.2"
    fill="#C4B5FD"
  >
    BACKEND • AUTOMATION • IoT • INTELLIGENT SYSTEMS
  </text>
</svg>
