<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="55%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#160D2A"/>
    </linearGradient>

    <radialGradient id="signal" cx="50%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#293241"/>
      <stop offset="100%" stop-color="#090D14"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <path
      id="bat"
      d="
        M0,-5
        C-12,-16 -25,-18 -37,-12
        C-30,-5 -25,0 -23,8
        C-18,3 -12,2 -7,5
        L0,14
        L7,5
        C12,2 18,3 23,8
        C25,0 30,-5 37,-12
        C25,-18 12,-16 0,-5
        Z
      "
    />
  </defs>

  <rect
    width="1000"
    height="230"
    rx="18"
    fill="url(#bg)"
  />

  <rect
    x="1"
    y="1"
    width="998"
    height="228"
    rx="17"
    fill="none"
    stroke="#7C3AED"
    stroke-opacity="0.45"
  />

  <ellipse
    cx="500"
    cy="88"
    rx="210"
    ry="88"
    fill="url(#signal)"
  >
    <animate
      attributeName="opacity"
      values="0.55;1;0.55"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </ellipse>

  <ellipse
    cx="500"
    cy="87"
    rx="95"
    ry="48"
    fill="#A855F7"
    opacity="0.12"
    filter="url(#softGlow)"
  >
    <animate
      attributeName="rx"
      values="82;105;82"
      dur="3.2s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="ry"
      values="40;53;40"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </ellipse>

  <g
    transform="translate(500 84) scale(1.35)"
    fill="#090D14"
    stroke="#C084FC"
    stroke-width="1.3"
    filter="url(#glow)"
  >
    <use href="#bat"/>

    <animateTransform
      attributeName="transform"
      type="scale"
      additive="sum"
      values="1.32;1.45;1.32"
      dur="3.2s"
      repeatCount="indefinite"
    />
  </g>

  <g fill="#A855F7" opacity="0.85">
    <use href="#bat" transform="scale(.34)"/>

    <animateMotion
      dur="8s"
      repeatCount="indefinite"
      path="M80,62 C250,20 360,65 500,42 C680,10 790,70 930,35"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.12;0.88;1"
      dur="8s"
      repeatCount="indefinite"
    />
  </g>

  <g fill="url(#city)">
    <path
      d="
        M0 190
        V150 H35
        V130 H58
        V162 H88
        V119 H112
        V151 H145
        V104 H170
        V155 H204
        V127 H235
        V166 H265
        V111 H290
        V146 H324
        V132 H355
        V166 H388
        V118 H421
        V150 H451
        V106 H477
        V151 H512
        V123 H540
        V158 H574
        V116 H603
        V149 H632
        V101 H658
        V153 H694
        V128 H725
        V166 H755
        V114 H780
        V148 H815
        V125 H845
        V159 H876
        V108 H904
        V151 H938
        V133 H965
        V165 H1000
        V230 H0
        Z
      "
    />
  </g>

  <g fill="#7C3AED" opacity="0.78">
    <rect x="94" y="132" width="5" height="9"/>
    <rect x="104" y="132" width="5" height="9"/>

    <rect x="151" y="118" width="5" height="8"/>
    <rect x="161" y="118" width="5" height="8"/>

    <rect x="272" y="125" width="5" height="8"/>
    <rect x="282" y="125" width="5" height="8"/>

    <rect x="457" y="119" width="5" height="8"/>
    <rect x="467" y="119" width="5" height="8"/>

    <rect x="637" y="114" width="5" height="8"/>
    <rect x="647" y="114" width="5" height="8"/>

    <rect x="762" y="127" width="5" height="8"/>
    <rect x="772" y="127" width="5" height="8"/>

    <rect x="883" y="121" width="5" height="8"/>
    <rect x="893" y="121" width="5" height="8"/>
  </g>

  <g opacity="0.9">
    <rect x="55" y="200" width="13" height="13" rx="2" fill="#2D174D"/>
    <rect x="72" y="200" width="13" height="13" rx="2" fill="#4C1D95"/>
    <rect x="89" y="200" width="13" height="13" rx="2" fill="#7C3AED"/>
    <rect x="106" y="200" width="13" height="13" rx="2" fill="#A855F7"/>
    <rect x="123" y="200" width="13" height="13" rx="2" fill="#4C1D95"/>

    <rect x="864" y="200" width="13" height="13" rx="2" fill="#4C1D95"/>
    <rect x="881" y="200" width="13" height="13" rx="2" fill="#A855F7"/>
    <rect x="898" y="200" width="13" height="13" rx="2" fill="#7C3AED"/>
    <rect x="915" y="200" width="13" height="13" rx="2" fill="#4C1D95"/>
    <rect x="932" y="200" width="13" height="13" rx="2" fill="#2D174D"/>
  </g>

  <text
    x="500"
    y="200"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="13"
    font-weight="700"
    letter-spacing="3"
    fill="#C4B5FD"
  >
    BUILD • TEST • IMPROVE
  </text>
</svg>
